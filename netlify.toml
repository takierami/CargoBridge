[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.29.2"
  # Prefer setting VITE_API_URL in the Netlify UI (Site settings → Environment variables).
  # Example: VITE_API_URL=https://api.example.com/api
  # Build succeeds without it, but login will not work until it is set.
  # Do not put Django secrets here — only VITE_* is baked into the frontend bundle.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
