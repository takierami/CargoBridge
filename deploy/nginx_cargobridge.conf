# CargoBridge — single VPS, path-based (React + Django/Gunicorn).
# Replace <PATH_TO_PROJECT> with the clone path on the VPS.
# Vite builds to dist/ — copy or symlink it to frontend-build before enabling this site.
# After DNS + HTTP work, add HTTPS with certbot.

server {
    listen 80;
    listen [::]:80;
    server_name cargobridgedz.com www.cargobridgedz.com;

    client_max_body_size 20M;

    root <PATH_TO_PROJECT>/frontend-build;
    index index.html;

    location /django-static/ {
        alias <PATH_TO_PROJECT>/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /api/ {
        proxy_pass http://unix:/run/cargobridge.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
